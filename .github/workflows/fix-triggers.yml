name: fix-triggers
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('triggers.js');s=p.read_text()
          s=s.replace('function getTriggerReply(\n  rawText,\n  senderId\n) {','async function getTriggerReply(\n  rawText,\n  senderId,\n  threadId,\n  api,\n  event\n) {',1)
          m='// TRIGGER / ID MATCHING\n// ============================================================\n'
          h='''async function resolveReplyTargetName(api,event){const r=event&&event.messageReply,id=r&&(r.senderID||r.senderId||r.sender_id);if(!id||!api||typeof api.getUserInfo!=="function")return null;try{const u=await new Promise((a,b)=>api.getUserInfo(String(id),(e,x)=>e?b(e):a(x)));return u&&u[String(id)]&&u[String(id)].name?String(u[String(id)].name).trim():null}catch(e){return null;}}\n\n'''
          if 'resolveReplyTargetName' not in s:s=s.replace(m,m+h,1)
          s=s.replace('if (hit) {\n      return getNextReply(group);\n    }','if (hit) {\n      const reply=getNextReply(group);\n      if(String(reply).trim().toLowerCase()==="jaiden na naman"){const n=await resolveReplyTargetName(api,event);return n?`${n} na naman`:reply;}\n      return reply;\n    }',1);p.write_text(s)
          p=Path('index.js');s=p.read_text();s=s.replace('const triggerReply = await getTriggerReply(\n      body,\n      senderId,\n      threadId\n    );','const triggerReply = await getTriggerReply(\n      body,\n      senderId,\n      threadId,\n      api,\n      event\n    );',1);s=s.replace('"sino uupakan kong mukhang aso dito?"','require("./slash-banats")()',1);p.write_text(s)
          PY
          git config user.name eclipse-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add triggers.js index.js
          git commit -m "fix: dynamic reply names and randomized slash banat" || exit 0
          git push
