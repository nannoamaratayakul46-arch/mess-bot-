name: ECLIPSE Backend Syntax

on:
  push:
    branches: [main, dashboard-read-api]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax-check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' -print0)

      - name: Runtime architecture tests
        run: npm test
