name: ECLIPSE Backend Syntax

on:
  push:
    branches: [main, dashboard-read-api]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm install

      - name: Syntax-check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' -print0)

      - name: Repository architecture audit
        run: npm run audit

      - name: Runtime architecture tests
        run: npm test
