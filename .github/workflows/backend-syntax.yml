name: ECLIPSE Backend Syntax

on:
  push:
    branches: [main, dashboard-read-api]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: node --check index.js
      - run: node --check db.js
