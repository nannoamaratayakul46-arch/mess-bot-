name: ws3-fca 3.5.2 migration validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - upgrade/ws3-fca-3.5.2-main-compatible

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies without unrelated third-party binary downloads
        run: npm ci --ignore-scripts

      - name: Validate the pinned ws3-fca package
        run: node scripts/patch-ws3-fca.js

      - name: Run repository verification
        run: npm run verify
