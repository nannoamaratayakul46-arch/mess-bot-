name: Apply ECLIPSE trigger fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch trigger behavior
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('triggers.js')
          s = p.read_text(encoding='utf-8')

          old = '''function getTriggerReply(\n  rawText,\n  senderId\n) {'''
          new = '''async function getTriggerReply(\n  rawText,\n  senderId,\n  threadId,\n  api,\n  event\n) {'''
          if old not in s:
              raise SystemExit('getTriggerReply signature not found')
          s = s.replace(old, new, 1)

          marker = '// TRIGGER / ID MATCHING\n// ============================================================\n'
          helper = '''\nasync function resolveReplyTargetName(api, event) {\n  const reply = event && event.messageReply;\n  const targetId = reply && (reply.senderID || reply.senderId || reply.sender_id);\n\n  if (!targetId || !api || typeof api.getUserInfo !== "function") {\n    return null;\n  }\n\n  try {\n    const users = await new Promise((resolve, reject) => {\n      api.getUserInfo(String(targetId), (err, result) => {\n        if (err) return reject(err);\n        resolve(result);\n      });\n    });\n\n    const user = users && (users[String(targetId)] || users[targetId]);\n    return user && user.name ? String(user.name).trim() : null;\n  } catch (err) {\n    console.warn('[TRIGGERS] Failed to resolve reply target:', err && err.message ? err.message : err);\n    return null;\n  }\n}\n\n'''
          if 'async function resolveReplyTargetName' not in s:
              if marker not in s:
                  raise SystemExit('trigger marker not found')
              s = s.replace(marker, marker + helper, 1)

          old_hit = '''    if (hit) {\n      return getNextReply(group);\n    }'''
          new_hit = '''    if (hit) {\n      const reply = getNextReply(group);\n\n      if (String(reply).trim().toLowerCase() === "jaiden na naman") {\n        const targetName = await resolveReplyTargetName(api, event);\n        return targetName ? `${targetName} na naman` : reply;\n      }\n\n      return reply;\n    }'''
          if old_hit not in s:
              raise SystemExit('trigger hit block not found')
          s = s.replace(old_hit, new_hit, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('index.js')
          s = p.read_text(encoding='utf-8')
          old_call = '''const triggerReply = await getTriggerReply(\n      body,\n      senderId,\n      threadId\n    );'''
          new_call = '''const triggerReply = await getTriggerReply(\n      body,\n      senderId,\n      threadId,\n      api,\n      event\n    );'''
          if old_call not in s:
              raise SystemExit('index trigger call not found')
          s = s.replace(old_call, new_call, 1)

          pool = '''const SLASH_BANAT_REPLIES = Object.freeze([\n  "puta, andito na God niyo, supaen niyo ttko",\n  "asan na yung mga mahihinang tae? gagawin kong matigas na tubol yan",\n  "hoy babaeng mukhang acne, sabi ko wag ka mag yabang dito",\n  "kaninong ea to? kantutin ko",\n  "Hev Abi is otw to save u, baby.",\n  "Oh akala ko ba 'di ka pumapatol sa 'di gumagastos'Di mo kaya pagka bastos koKahit 'di mo na sabihin alam ko ang gustoPanatilihin nating lihimKahit 'di na kahit pa ma