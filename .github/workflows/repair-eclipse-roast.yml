name: Repair ECLIPSE roast behavior

on:
  push:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Patch ECLIPSE roast behavior
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.ref.replace('refs/heads/', '');

            async function getFile(path) {
              const r = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              if (Array.isArray(r.data) || !r.data.content) throw new Error(`Cannot read ${path}`);
              return {
                sha: r.data.sha,
                content: Buffer.from(r.data.content, 'base64').toString('utf8'),
              };
            }

            async function putFile(path, sha, content, message) {
              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                branch,
                sha,
                message,
                content: Buffer.from(content, 'utf8').toString('base64'),
              });
            }

