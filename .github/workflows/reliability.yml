name: Reliability CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/messenger-facebook-restriction-backoff

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: YOUTUBE_DL_SKIP_DOWNLOAD=true npm ci
      - run: npm run verify
