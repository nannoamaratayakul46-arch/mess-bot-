<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17111c">
  <title>ECLIPSE Lab</title>
  <style>
    :root{color-scheme:dark;--bg:#0f0b14;--panel:#17111f;--panel2:#21172b;--text:#f8eefc;--muted:#bdaec4;--accent:#f39bd7;--accent2:#c9a7ff;--border:#34243e}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at top,#2b1833 0,#0f0b14 48%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);min-height:100vh}
    main{width:min(760px,100%);margin:auto;padding:20px 16px 40px}
    header{padding:10px 2px 18px}
    .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700}
    h1{font-size:30px;margin:5px 0 2px}
    .sub{color:var(--muted);font-size:14px}
    section{background:rgba(23,17,31,.94);border:1px solid var(--border);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 10px 30px #0005}
    label{display:block;font-size:12px;color:var(--muted);margin:12px 0 7px}
    input,textarea{width:100%;border:1px solid var(--border);background:#100c15;color:var(--text);border-radius:12px;padding:12px;font:inherit;outline:none}
    input:focus,textarea:focus{border-color:var(--accent)}
    textarea{min-height:100px;resize:vertical}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    button{width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#180f1c;margin-top:12px}
    button.secondary{background:#291d32;color:var(--text);border:1px solid var(--border)}
    .status{font-size:13px;color:var(--muted);min-height:20px;margin-top:10px}
    .result{display:none}
    .result.show{display:block}
    .final{font-size:20px;line-height:1.4;background:#100c15;border:1px solid var(--border);border-radius:14px;padding:14px;margin-top:8px;white-space:pre-wrap;word-break:break-word}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
    .stat{background:#100c15;border:1px solid var(--border);border-radius:12px;padding:10px}
    .stat b{display:block;font-size:17px;margin-top:3px}
    .stat span{font-size:11px;color:var(--muted)}
    details{margin-top:12px;color:var(--muted)}
    pre{white-space:pre-wrap;word-break:break-word;font-size:11px;background:#100c15;padding:12px;border-radius:12px;overflow:auto}
    @media(max-width:520px){.row{grid-template-columns:1fr}main{padding-top:12px}h1{font-size:27px}}
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">♡ ECLIPSE LAB</div>
    <h1>Banat Human Simulator</h1>
    <div class="sub">Mobile developer dashboard · uses the real ECLIPSE humanization pipeline</div>
  </header>

  <section>
    <label for="apiUrl">Render / API URL</label>
    <input id="apiUrl" placeholder="https://your-app.onrender.com" autocomplete="url">

    <label for="apiKey">Dashboard API key</label>
    <input id="apiKey" type="password" placeholder="ECLIPSE_DASHBOARD_API_KEY" autocomplete="off">

    <label for="incoming">Incoming message</label>
    <textarea id="incoming" placeholder="bro why 😭"></textarea>

    <label for="candidate">Candidate reply <span style="opacity:.65">(optional)</span></label>
    <textarea id="candidate" placeholder="Leave empty and ECLIPSE will answer it"></textarea>

    <div class="row">
      <button id="simulate">SIMULATE</button>
      <button id="clear" class="secondary">CLEAR</button>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section id="result" class="result">
    <label>Humanized reply</label>
    <div id="final" class="final"></div>
    <div class="stats">
      <div class="stat"><span>Reaction</span><b id="reaction">—</b></div>
      <div class="stat"><span>Typing</span><b id="typing">—</b></div>
      <div class="stat"><span>Total</span><b id="total">—</b></div>
      <div class="stat"><span>Mode</span><b id="mode">—</b></div>
      <div class="stat"><span>Momentum</span><b id="momentum">—</b></div>
      <div class="stat"><span>Incoming words</span><b id="words">—</b></div>
    </div>
    <details>
      <summary>Context JSON</summary>
      <pre id="context"></pre>
    </details>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const savedUrl = localStorage.getItem("eclipseLabApiUrl") || location.origin;
const savedKey = localStorage.getItem("eclipseLabApiKey") || "";
$("apiUrl").value = savedUrl;
$("apiKey").value = savedKey;

$("clear").addEventListener("click", () => {
  $("incoming").value = "";
  $("candidate").value = "";
  $("status").textContent = "";
  $("result").classList.remove("show");
});

$("simulate").addEventListener("click", async () => {
  const apiUrl = $("apiUrl").value.trim().replace(/\/+$/, "");
  const apiKey = $("apiKey").value.trim();
  const incomingText = $("incoming").value;
  const candidate = $("candidate").value;

  if (!apiUrl || !apiKey || !incomingText.trim()) {
    $("status").textContent = "Enter the API URL, API key, and incoming message.";
    return;
  }

  localStorage.setItem("eclipseLabApiUrl", apiUrl);
  localStorage.setItem("eclipseLabApiKey", apiKey);
  $("status").textContent = "Simulating…";
  $("result").classList.remove("show");

  try {
    const response = await fetch(apiUrl + "/api/dev/banat/simulate", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-ECLIPSE-DASHBOARD-KEY": apiKey
      },
      body: JSON.stringify({
        threadID: "eclipse-mobile-lab",
        incomingText,
        candidate
      })
    });

    const data = await response.json().catch(() => ({}));
    if (!response.ok || !data.ok) {
      throw new Error(data.error || "Simulation request failed.");
    }

    $("final").textContent = data.output.text;
    $("reaction").textContent = Math.round(data.output.reactionMs) + " ms";
    $("typing").textContent = Math.round(data.output.typingMs) + " ms";
    $("total").textContent = Math.round(data.output.totalMs) + " ms";
    $("mode").textContent = data.context?.mode || "—";
    $("momentum").textContent = data.context?.momentum ?? "—";
    $("words").textContent = data.context?.incomingWords ?? "—";
    $("context").textContent = JSON.stringify(data.context, null, 2);
    $("result").classList.add("show");
    $("status").textContent = "Done.";
  } catch (error) {
    $("status").textContent = error.message || "Could not reach ECLIPSE.";
  }
});
</script>
</body>
</html>
